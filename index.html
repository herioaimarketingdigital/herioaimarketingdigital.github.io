<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#07070a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HerioMarketingDigital360 Maroc</title>
<style>
:root{--bg:#07070a;--card:#12110f;--gold:#e5b846;--gold2:#fff1b0;--red:#c8102e;--txt:#f4efe3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:radial-gradient(ellipse at top,#1b1608 0,var(--bg) 60%) fixed;color:var(--txt);font-family:'Segoe UI',Tahoma,'Noto Naskh Arabic',Arial,sans-serif;overflow-x:hidden;line-height:1.7}
.gold{background:linear-gradient(90deg,#b8862b,var(--gold2),var(--gold),#b8862b);-webkit-background-clip:text;background-clip:text;color:transparent}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4%;background:rgba(7,7,10,.8);backdrop-filter:blur(10px);border-bottom:1px solid #e5b84633}
.logo{font-weight:900;font-size:1.5rem;letter-spacing:1px}
nav{display:flex;gap:18px}
nav a{color:var(--txt);text-decoration:none;font-size:.95rem}
nav a:hover{color:var(--gold)}
.langs{display:flex;gap:6px}
.langs button{background:#1a1810;border:1px solid #e5b84655;border-radius:10px;font-size:1.3rem;padding:2px 7px;cursor:pointer;transition:.3s;transform-style:preserve-3d}
.langs button:hover,.langs button.on{transform:translateY(-3px) rotateX(15deg);border-color:var(--gold);box-shadow:0 6px 14px #e5b84655}
section{padding:90px 5% 50px;max-width:1200px;margin:auto}
.hero{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:30px;padding-top:110px}
.hero small{color:var(--gold);letter-spacing:3px}
.hero h1{font-size:clamp(2rem,5vw,3.8rem);line-height:1.3;margin:10px 0}
.hero h2{font-size:clamp(1.1rem,2.4vw,1.6rem);font-weight:600;margin-bottom:12px}
.red{display:inline-block;background:var(--red);padding:4px 22px;transform:skewX(-8deg);font-weight:800;font-size:1.3rem;box-shadow:0 8px 20px #c8102e66;margin:6px 0 18px}
.btn{display:inline-block;padding:13px 28px;border-radius:50px;font-weight:800;text-decoration:none;margin:6px 4px 0;transition:.3s;border:2px solid var(--gold)}
.btn.p{background:linear-gradient(135deg,#b8862b,var(--gold2),var(--gold));color:#1a1200;box-shadow:0 10px 25px #e5b84655}
.btn.s{color:var(--gold)}
.btn:hover{transform:translateY(-4px) scale(1.04)}
.stage{perspective:1000px;display:flex;justify-content:center;align-items:center;height:340px}
.cube{width:170px;height:170px;position:relative;transform-style:preserve-3d;animation:spin 16s linear infinite}
.cube div{position:absolute;inset:0;display:grid;place-items:center;font-size:4rem;background:linear-gradient(135deg,#2a2107dd,#0b0905dd);border:2px solid var(--gold);box-shadow:inset 0 0 30px #e5b84655,0 0 20px #e5b84644}
.cube div:nth-child(1){transform:translateZ(85px)}.cube div:nth-child(2){transform:rotateY(180deg) translateZ(85px)}
.cube div:nth-child(3){transform:rotateY(90deg) translateZ(85px)}.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(85px)}
.cube div:nth-child(5){transform:rotateX(90deg) translateZ(85px)}.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(85px)}
.ring{position:absolute;width:300px;height:300px;border:2px dashed #e5b84666;border-radius:50%;transform:rotateX(75deg);animation:ringspin 10s linear infinite}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
@keyframes ringspin{to{transform:rotateX(75deg) rotateZ(360deg)}}
h3.t{text-align:center;font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;perspective:1100px}
.card{background:linear-gradient(145deg,#1a1608,var(--card));border:1px solid #e5b84655;border-radius:18px;padding:26px 20px;text-align:center;transform-style:preserve-3d;transition:transform .15s,box-shadow .3s;will-change:transform}
.card:hover{box-shadow:0 20px 40px #e5b84633}
.card i{font-style:normal;display:block;font-size:2.6rem;transform:translateZ(45px);margin-bottom:8px}
.card h4{color:var(--gold);transform:translateZ(30px)}
.card p{font-size:.92rem;opacity:.85;transform:translateZ(18px)}
.offer{text-align:center;perspective:900px}
.price{display:inline-block;padding:30px 60px;border-radius:30px;border:3px solid var(--gold);background:radial-gradient(circle,#2b2208,#0a0804);box-shadow:0 0 50px #e5b84655;transform:rotateX(8deg);animation:float 4s ease-in-out infinite;position:relative}
.price b{font-size:clamp(3.5rem,13vw,7rem);line-height:1;display:block;filter:drop-shadow(0 6px 10px #000)}
.price span{font-size:1.6rem}
.price em{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);background:var(--red);padding:3px 26px;border-radius:6px;font-style:normal;font-weight:800;white-space:nowrap}
@keyframes float{50%{transform:rotateX(8deg) translateY(-14px)}}
.why .card i{font-size:2rem}
.poster{text-align:center;perspective:1200px}
.poster img{max-width:min(100%,520px);border-radius:20px;border:2px solid var(--gold);box-shadow:0 30px 60px #000,0 0 40px #e5b84644;transition:transform .15s}
.contact{text-align:center}
.wa{display:inline-flex;align-items:center;gap:14px;border:3px solid var(--gold);border-radius:60px;padding:12px 28px;font-size:clamp(1.3rem,5vw,2.2rem);font-weight:800;color:var(--txt);text-decoration:none;direction:ltr;background:#0d0b06}
footer{text-align:center;padding:26px;border-top:1px solid #e5b84633;font-size:.9rem;opacity:.8}
.fab{position:fixed;z-index:60;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;text-decoration:none;color:#fff;border:0;cursor:pointer;box-shadow:0 8px 20px #000a;transition:.3s;inset-inline-end:16px}
.fab:hover{transform:translateY(-5px) scale(1.1) rotateY(20deg)}
.fab.wa1{background:#25d366;bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:pulse 2s infinite}
.fab.ph{background:var(--red);bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.fab.up{background:var(--gold);color:#1a1200;bottom:calc(152px + env(safe-area-inset-bottom,0px))}
@keyframes pulse{0%{box-shadow:0 0 0 0 #25d366aa}100%{box-shadow:0 0 0 22px #25d36600}}
.rv{opacity:0;transform:translateY(40px) rotateX(15deg);transition:1s}
.rv.in{opacity:1;transform:none}
@media(max-width:820px){.hero{grid-template-columns:1fr;text-align:center}.stage{height:280px;order:-1;margin-top:20px}.cube{transform:scale(.8)}}
@media(max-width:420px){.logo{font-size:1.1rem}.langs button{font-size:1.1rem;padding:1px 5px}}
.top3d{padding-top:100px;padding-bottom:0;perspective:1200px;text-align:center}
.top3d img{width:100%;max-width:900px;border-radius:22px;border:2px solid var(--gold);box-shadow:0 40px 70px #000,0 0 50px #e5b84655;transform:rotateX(6deg);transition:transform .15s;background:#1a1608}
.top3d+.hero{padding-top:40px;min-height:auto}
.gal{perspective:1400px;height:360px;display:flex;justify-content:center;align-items:center;overflow:hidden;--z:300px}
.car{position:relative;width:220px;height:300px;transform-style:preserve-3d;animation:cs 24s linear infinite}
.gal:hover .car{animation-play-state:paused}
.car img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;border:2px solid var(--gold);box-shadow:0 0 25px #e5b84655;background:#1a1608;transform:rotateY(calc(var(--i)*60deg)) translateZ(var(--z))}
@keyframes cs{to{transform:rotateY(-360deg)}}
@media(max-width:600px){.gal{height:270px;--z:210px}.car{width:150px;height:210px}}
@media(max-width:820px){.top3d+.hero{padding-top:10px}}
.car.rev{animation-direction:reverse;animation-duration:30s}
.fw{perspective:1400px}
.form{max-width:760px;margin:auto;background:linear-gradient(145deg,#1a1608,#0d0b06);border:1px solid #e5b84655;border-radius:22px;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:16px;box-shadow:0 30px 60px #000a,0 0 40px #e5b84622;transform:rotateX(3deg)}
.f{display:flex;flex-direction:column;gap:6px}.f.full{grid-column:1/-1}
.form label.l{color:var(--gold);font-size:.9rem}
.form input[type=text],.form input[type=tel],.form input[type=email],.form select,.form textarea,.rin input,.rin textarea{background:#0a0905;border:1px solid #e5b84655;border-radius:12px;color:var(--txt);padding:12px;font:inherit;width:100%;transition:.3s}
.form input:focus,.form select:focus,.form textarea:focus,.rin input:focus,.rin textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px #e5b84633}
.inv{border-color:#ff4d4d!important}
.err{color:#ff7b7b;font-size:.78rem;min-height:1em}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid #e5b84677;border-radius:30px;padding:7px 16px;cursor:pointer;transition:.3s;font-size:.9rem}
.pill input{display:none}
.pill:has(input:checked){background:linear-gradient(135deg,#b8862b,var(--gold2));color:#1a1200;font-weight:800;box-shadow:0 6px 16px #e5b84655}
.bar{grid-column:1/-1;height:6px;background:#2a2410;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8862b,var(--gold2));transition:width .4s}
.cnt{font-size:.75rem;opacity:.6;text-align:end}
.chk{display:flex;gap:10px;align-items:center;font-size:.9rem}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
button.btn{font:inherit;font-weight:800;cursor:pointer}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,120px);background:#0d0b06;border:2px solid var(--gold);color:var(--txt);padding:12px 24px;border-radius:40px;z-index:99;transition:.5s;max-width:90%;text-align:center}
.toast.s{transform:translate(-50%,0)}
.rsum{display:flex;gap:30px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:30px}
.big{font-size:4.5rem;font-weight:900;line-height:1}
.stars{color:var(--gold);letter-spacing:2px}
.dist{min-width:200px;direction:ltr}
.dist div{display:flex;align-items:center;gap:8px;font-size:.8rem}
.dist span.b{flex:1;height:7px;background:#2a2410;border-radius:5px;overflow:hidden}
.dist span.b i{display:block;height:100%;background:var(--gold)}
.rc{text-align:start}
.rc .who{display:flex;gap:10px;align-items:center;margin-bottom:6px;transform:translateZ(25px)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#b8862b,var(--gold2));color:#1a1200;display:grid;place-items:center;font-weight:900}
.rc p{transform:translateZ(15px)}
.rin{max-width:620px;margin:34px auto 0;display:grid;gap:12px;background:#0d0b06;border:1px solid #e5b84655;border-radius:18px;padding:22px}
.sin button{background:none;border:0;font-size:2.2rem;color:#4a4020;cursor:pointer;transition:.2s}
.sin button.on{color:var(--gold);text-shadow:0 0 12px #e5b84699}
.sin button:hover{transform:scale(1.25) rotate(-8deg)}
@media(max-width:600px){.form{grid-template-columns:1fr;padding:20px}}
.fab svg{width:30px;height:30px;fill:#fff}
.fab.fb{background:#1877f2;bottom:calc(152px + env(safe-area-inset-bottom,0px))}
.fab.up{bottom:calc(220px + env(safe-area-inset-bottom,0px))!important}
.soc{margin-top:22px;display:flex;gap:14px;justify-content:center}
.soc a{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;transition:.3s;box-shadow:0 8px 18px #000a}
.soc a:hover{transform:translateY(-6px) rotateY(25deg) scale(1.12)}
.soc svg{width:28px;height:28px;fill:#fff}
.fab.wa1{background:none;box-shadow:0 8px 20px #000a}
.fab svg.wal,.soc svg.wal{width:100%;height:100%;fill:none}
.soc a svg.wal{width:52px;height:52px}
.fab.aib{background:linear-gradient(135deg,#b8862b,#fff1b0,#e5b846);inset-inline-end:auto;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.fab.aib svg{fill:#1a1200}
.chat{position:fixed;z-index:70;inset-inline-start:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));height:min(520px,70vh);display:none;flex-direction:column;background:#0d0b06;border:2px solid var(--gold);border-radius:20px;box-shadow:0 30px 60px #000,0 0 40px #e5b84644;overflow:hidden}
.chat.o{display:flex;animation:pop .45s}
@keyframes pop{from{opacity:0;transform:perspective(800px) rotateX(25deg) scale(.8)}}
.chh{padding:12px 16px;background:linear-gradient(135deg,#2b2208,#0d0b06);border-bottom:1px solid #e5b84655;display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--gold)}
.chh button{background:none;border:0;color:var(--txt);font-size:1.3rem;cursor:pointer}
.cms{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bb{max-width:85%;padding:9px 13px;border-radius:16px;font-size:.92rem;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.bb.a{background:#1d190b;border:1px solid #e5b84633;align-self:flex-start}
.bb.u{background:linear-gradient(135deg,#b8862b,var(--gold2));color:#1a1200;align-self:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:#1a1608;border:1px solid #e5b84677;color:var(--gold);border-radius:20px;padding:5px 12px;font:inherit;font-size:.8rem;cursor:pointer}
.cin{display:flex;gap:8px;padding:10px;border-top:1px solid #e5b84655}
.cin input{flex:1;background:#0a0905;border:1px solid #e5b84655;border-radius:20px;color:var(--txt);padding:10px 14px;font:inherit;min-width:0}
.cin button{background:linear-gradient(135deg,#b8862b,var(--gold2));border:0;border-radius:50%;width:42px;height:42px;font-size:1.1rem;cursor:pointer;color:#1a1200;font-weight:900}
.cin button:disabled{opacity:.5}

/* ===== Responsive: all devices ===== */
html{-webkit-text-size-adjust:100%;font-size:clamp(16px,.45vw + 12px,20px)}
img{max-width:100%}
.bur{display:none;background:#1a1810;border:1px solid #e5b84655;border-radius:10px;color:var(--gold);font-size:1.4rem;width:42px;height:38px;cursor:pointer}
.gal{--w:220px;--h:300px;--z:300px;height:calc(var(--h) + 60px)}
.car{width:var(--w);height:var(--h)}
.hero{min-height:100svh}
@media(max-width:1100px){
 .bur{display:block}
 header{flex-wrap:nowrap}
 nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:14px;padding:16px 5%;background:rgba(7,7,10,.97);border-bottom:1px solid #e5b84655}
 header.menu nav{display:flex}
 nav a{font-size:1.05rem;padding:4px 0}
 .logo{margin-inline-end:auto}
}
@media(max-width:820px){.hero{min-height:auto;padding-bottom:30px}.hero .btn{display:block;max-width:340px;margin:10px auto 0}}
@media(max-width:700px){.form{grid-template-columns:1fr;padding:20px;transform:none}.rsum{gap:18px}}
@media(max-width:600px){
 section{padding:70px 4% 36px}
 .gal{--w:150px;--h:210px;--z:165px}
 .price{padding:24px 34px}
 .chat{width:calc(100vw - 24px);inset-inline-start:12px;height:min(520px,calc(100dvh - 170px))}
 .fab{width:50px;height:50px}.fab svg{width:26px;height:26px}
 .fab.wa1{bottom:calc(14px + env(safe-area-inset-bottom,0px))}.fab.ph{bottom:calc(74px + env(safe-area-inset-bottom,0px))}.fab.fb{bottom:calc(134px + env(safe-area-inset-bottom,0px))}.fab.up{bottom:calc(194px + env(safe-area-inset-bottom,0px))!important}
 .fab.aib{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:380px){.gal{--w:125px;--h:175px;--z:140px}.card{padding:20px 14px}.btn{padding:12px 20px}}
@media(min-width:1400px){section{max-width:1380px}.top3d img{max-width:1100px}.stage{height:420px}.cube{width:210px;height:210px}.cube div{font-size:5rem}.cube div:nth-child(1){transform:translateZ(105px)}.cube div:nth-child(2){transform:rotateY(180deg) translateZ(105px)}.cube div:nth-child(3){transform:rotateY(90deg) translateZ(105px)}.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(105px)}.cube div:nth-child(5){transform:rotateX(90deg) translateZ(105px)}.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(105px)}.ring{width:360px;height:360px}.gal{--w:270px;--h:370px;--z:370px;perspective:1800px}.grid{gap:28px}header{padding:10px 6%}}
@media(min-width:1900px){section{max-width:1640px}.gal{--w:320px;--h:440px;--z:440px}}
@media(max-height:520px) and (orientation:landscape){
 .hero{min-height:auto}.stage{height:230px}
 .fab{width:42px;height:42px}.fab svg{width:22px;height:22px;font-size:1.2rem}
 .fab.wa1,.fab.aib{bottom:8px}.fab.ph{bottom:56px}.fab.fb{bottom:104px}.fab.up{bottom:152px!important}
 .chat{height:calc(100dvh - 80px);bottom:60px}
}
@media(hover:none){.card:hover{box-shadow:none}.btn:hover,.fab:hover{transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>

<header>
<div class="logo gold">HD</div>
<nav><a href="#services" data-i="n1"></a><a href="#gallery" data-i="gt"></a><a href="#offer" data-i="n2"></a><a href="#reviews" data-i="rt"></a><a href="#contact" data-i="n3"></a></nav>
